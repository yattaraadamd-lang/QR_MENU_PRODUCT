name: Security CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Security & Tenant Isolation Tests
        run: npm test

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-production-32chars"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: NPM Audit (critical — blocking)
        run: npm audit --omit=dev --audit-level=critical

      - name: NPM Audit (high — advisory)
        if: always()
        run: npm audit --omit=dev --audit-level=high || true
        # Note: High-level issues are reported but do not block the pipeline.
        # Review and address these in a timely manner.

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for potential hardcoded secrets..."
          # Check for common secret patterns in source files
          FOUND=0
          if grep -rn "admin123\|garson123\|password123\|changeme\|default-dev-secret" src/ --include="*.ts" --include="*.tsx" --include="*.js" 2>/dev/null; then
            echo "⚠️  WARNING: Potential hardcoded secrets found in src/"
            FOUND=1
          fi
          if grep -rn "admin123\|garson123\|password123\|changeme" server.js 2>/dev/null; then
            echo "⚠️  WARNING: Potential hardcoded secrets found in server.js"
            FOUND=1
          fi
          if [ $FOUND -eq 1 ]; then
            echo "::warning::Potential hardcoded secrets detected. Review the findings above."
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

      - name: Verify migrations are tracked
        run: |
          if [ -d "prisma/migrations" ]; then
            echo "✅ prisma/migrations/ directory exists"
            ls -la prisma/migrations/
          else
            echo "⚠️  prisma/migrations/ directory not found"
            echo "   This may be expected if no migrations exist yet"
          fi
