services:
  - type: web
    name: qr-menu-platform
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
        # IMPORTANT: Must be direct PostgreSQL connection (not pooled)
        # Format: postgresql://user:pass@host:5432/database
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CUSTOMER_DEVICE_HMAC_SECRET
        sync: false
        # IMPORTANT: Must be at least 32 random bytes (e.g. openssl rand -base64 32)
    healthCheckPath: /api/health
